<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播计划表模板编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --ui-bg:#1e2230; --ui-panel:#2a3042; --ui-accent:#5b8cff; --ui-text:#e8ebf5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ui-bg); color:var(--ui-text); font-family:"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh;}
  /* ===== 工具栏 ===== */
  #toolbar{
    position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 16px; background:var(--ui-panel); box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  #toolbar h1{font-size:15px; font-weight:600; margin-right:8px;}
  .btn{
    border:1px solid #45507a; background:#333c5e; color:var(--ui-text); border-radius:6px;
    padding:6px 14px; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn:hover{background:var(--ui-accent); border-color:var(--ui-accent);}
  .btn.primary{background:var(--ui-accent); border-color:var(--ui-accent); font-weight:600;}
  .btn.primary:hover{filter:brightness(1.15);}
  .seg{display:flex; border:1px solid #45507a; border-radius:6px; overflow:hidden;}
  .seg button{border:none; background:transparent; color:var(--ui-text); padding:6px 14px; font-size:13px; cursor:pointer;}
  .seg button.active{background:var(--ui-accent);}
  #hint{font-size:12px; color:#9aa3c0; margin-left:auto;}
  /* ===== 画布区 ===== */
  #stage{padding:30px 10px 80px; display:flex; justify-content:center;}
  .canvas-wrap{box-shadow:0 10px 40px rgba(0,0,0,.5); border-radius:4px; overflow:hidden;}
  .tpl{display:none;}
  .tpl.active{display:block;}
  /* 可编辑占位符通用样式 */
  [contenteditable]{outline:none; cursor:text;}
  [contenteditable]:hover{box-shadow:inset 0 0 0 1px rgba(91,140,255,.55);}
  [contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--ui-accent);}
  .img-slot{cursor:pointer; position:relative;}
  .img-slot:hover::after{
    content:"点击替换图片"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(30,34,48,.55); color:#fff; font-size:13px; opacity:0; transition:.15s;
  }
  .img-slot:hover:hover::after{opacity:1;}

  /* ============================================================
     模板 A：TWINKLE.STAR 竖版 1000 × 1450
  ============================================================ */
  #tplA{
    width:1000px; height:1450px; background:#eef3fb; position:relative;
    border:10px solid #5a86c6; font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .a-banner{width:100%; height:555px; overflow:hidden; background:#c9d8f0;}
  .a-banner img{width:100%; height:100%; object-fit:cover; display:block;}
  .a-banner .ph{width:100%; height:100%; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; color:#5a86c6; font-size:18px; background:repeating-linear-gradient(45deg,#d7e3f6 0 20px,#e4edf9 20px 40px);}
  .a-head{display:flex; align-items:center; padding:26px 34px 14px;}
  .a-logo{
    font-family:"Arial Black",Arial,sans-serif; font-weight:900; font-size:38px; font-style:italic;
    background:linear-gradient(180deg,#57b6f0,#3f7fe0); -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:1px; white-space:nowrap;
  }
  .a-title{
    flex:1; text-align:center; font-size:44px; font-weight:900; letter-spacing:6px;
    background:linear-gradient(180deg,#6fb6ea,#4a86d8); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .a-date{font-size:30px; font-weight:800; color:#4a86d8; white-space:nowrap;}
  .a-days-row{
    margin:6px 34px 0; padding:0 14px; display:grid; grid-template-columns:96px 1fr; gap:8px;
  }
  .a-days{
    background:#dde5f2; border-radius:12px; display:grid; grid-template-columns:repeat(7,1fr);
    gap:8px; padding:10px 0; text-align:center; color:#8b97b5;
  }
  .a-days b{display:block; font-size:26px;}
  .a-days i{display:block; font-style:normal; font-size:15px; font-weight:700; font-family:Arial;}
  .a-sec{margin:10px 34px 0; border-radius:14px; padding:14px; display:grid; grid-template-columns:96px 1fr; gap:8px; align-content:start; position:relative;}
  .a-sec::before{
    content:""; position:absolute; left:-24px; top:-6px; width:10px; height:60%;
    border-left:4px dashed currentColor; border-top:4px dashed currentColor; border-bottom:4px dashed currentColor; opacity:.35;
  }
  .a-row{display:contents;}
  .a-who{text-align:center; font-size:15px; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:4px;}
  .a-avatar{
    width:64px; height:64px; border-radius:50%; background:#fff center/cover no-repeat;
    border:3px dashed currentColor; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:inherit; overflow:hidden;
  }
  .a-cells{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; flex:1;}
  .a-cell{
    min-height:64px; display:flex; align-items:center; justify-content:center; border-radius:8px;
    font-size:24px; font-weight:800; color:inherit; text-align:center; padding:4px; line-height:1.2;
  }
  .a-cell:not(:empty){
    border:3px dashed currentColor; background:rgba(255,255,255,.65); box-shadow:none !important;
  }
  .a-cell.stamp{
    border:none !important; background:transparent !important;
    font-size:40px; letter-spacing:6px; opacity:.55; font-weight:900;
  }
  .a-note{
    min-height:64px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:52px; font-weight:900; letter-spacing:10px;
    color:rgba(255,255,255,.9); text-shadow:0 2px 0 rgba(0,0,0,.05);
  }
  .sec-yellow{background:#fdf3d8; color:#e0a63c;}
  .sec-blue{background:#ddeafb; color:#4a86d8;}
  .sec-pink{background:#fbdff0; color:#e86ba4;}
  .sec-green{background:#fbe3ea; color:#e87f96;}
  .sec-purple{background:#e9e0f8; color:#8a6bd0;}
  .a-corner{position:absolute; right:26px; font-size:13px; color:#c2a35a; writing-mode:vertical-rl;}

  /* ============================================================
     模板 B：一周排班表 横版 1600 × 1072
  ============================================================ */
  #tplB{
    width:1600px; height:1072px; position:relative; background:#f2efe6;
    border:14px solid #2e6b52; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:#2e6b52; overflow:hidden;
  }
  .b-paper-tex{position:absolute; inset:0; background:
    radial-gradient(circle at 20% 30%, rgba(46,107,82,.03) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(46,107,82,.03) 0 2px, transparent 3px),
    radial-gradient(circle at 45% 80%, rgba(46,107,82,.03) 0 2px, transparent 3px);
    pointer-events:none;}
  .b-corner{
    position:absolute; width:52px; height:52px; border-radius:50%; background:#2e6b52; color:#f2efe6;
    display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; z-index:5;
  }
  .b-corner.tl{top:14px; left:14px;} .b-corner.tr{top:14px; right:14px;}
  .b-corner.bl{bottom:14px; left:14px;} .b-corner.br{bottom:14px; right:14px;}
  .b-inner{position:absolute; inset:14px; padding:20px 30px;}
  .b-topline{display:flex; align-items:center; gap:16px; margin-top:8px;}
  .b-slogan{flex:1; min-width:0; display:flex; align-items:center; gap:14px; color:#2e6b52; font-size:20px; font-weight:700; letter-spacing:8px; white-space:nowrap;}
  .b-slogan .lines{flex:1; min-width:40px; height:12px; border-top:3px solid #2e6b52; border-bottom:3px solid #2e6b52;}
  .b-brand{
    display:flex; gap:6px;
  }
  .b-brand span{
    width:74px; height:74px; border-radius:50%; border:4px solid #2e6b52; background:#f2efe6;
    display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:900; color:#c0392b;
    margin:0 -8px;
  }
  .b-title{text-align:center; font-size:120px; font-weight:900; letter-spacing:24px; margin:18px 0 4px; color:#7fa590;}
  .b-sub{text-align:center; font-size:40px; font-weight:800; letter-spacing:6px; color:#7fa590;}
  .b-stars{text-align:center; font-size:16px; letter-spacing:10px; color:#7fa590; margin:4px 0 14px;}
  .b-members{display:flex; gap:14px; margin:0 0 10px 6px;}
  .b-members .m{
    width:52px; height:52px; border-radius:50%; color:#fff; font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .b-grid{
    display:grid; grid-template-columns:repeat(7,1fr); border:4px solid #2e6b52; background:#f2efe6;
  }
  .b-dayhead{
    border-right:4px solid #2e6b52; border-bottom:4px solid #2e6b52; text-align:center; padding:14px 4px 10px;
  }
  .b-dayhead:last-child{border-right:none;}
  .b-dayhead b{display:block; font-size:40px; font-weight:900;}
  .b-dayhead i{display:block; font-style:normal; font-size:24px; font-weight:700; color:#7fa590; margin-top:4px;}
  .b-cell{
    min-height:150px; border-right:4px solid #2e6b52; border-bottom:4px solid #2e6b52; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    font-size:38px; font-weight:900; padding:8px; word-break:break-all; line-height:1.35;
  }
  .b-cell:nth-child(7n){border-right:none;}
  .b-cell.stamp{color:#9dc3ae; font-size:110px !important; font-weight:900;}
  .b-cell.stamp::before{
    content:""; position:absolute; width:130px; height:130px; border-radius:50%;
    border:5px solid rgba(157,195,174,.55); background:rgba(157,195,174,.15);
  }
  .b-foot{display:flex; flex-direction:column; align-items:center; margin-top:16px;}
  .b-logo{font-size:44px; font-weight:900; color:#2e6b52; letter-spacing:4px;}
  .b-logo small{display:block; text-align:center; font-size:16px; letter-spacing:8px; font-family:Arial; font-weight:700;}
  .b-wave{
    position:absolute; left:0; right:0; bottom:0; height:70px; z-index:1; pointer-events:none;
    background:
      radial-gradient(circle at 25px 70px, transparent 24px, rgba(46,107,82,.35) 25px 33px, transparent 34px),
      radial-gradient(circle at 75px 70px, transparent 24px, rgba(46,107,82,.35) 25px 33px, transparent 34px);
    background-size:100px 70px; background-repeat:repeat-x;
  }
  /* 导出遮罩 */
  #exporting{
    position:fixed; inset:0; background:rgba(20,24,36,.7); z-index:999; display:none;
    align-items:center; justify-content:center; color:#fff; font-size:18px;
  }
</style>
</head>
<body>

<div id="toolbar">
  <h1>直播计划表编辑器</h1>
  <div class="seg">
    <button id="tabA" class="active" onclick="switchTpl('A')">模板 A · 竖版周预告</button>
    <button id="tabB" onclick="switchTpl('B')">模板 B · 横版排班表</button>
  </div>
  <button class="btn" onclick="addStamp()">加盖 / 取消「休·调养」章（点击格子后使用）</button>
  <button class="btn" onclick="resetTpl()">恢复占位内容</button>
  <button class="btn primary" onclick="exportPng()">导出 PNG 图片</button>
  <span id="hint">所有文字可直接点击编辑；头像和头图点击可上传替换；内容自动保存到浏览器</span>
</div>

<div id="stage">

  <!-- ================= 模板 A ================= -->
  <div class="canvas-wrap" id="wrapA">
  <div class="tpl active" id="tplA">
    <div class="a-banner img-slot" data-img="aBanner">
      <div class="ph">🖼️ 顶部头图占位<br><small>点击上传横幅图片（约 1000 × 555）</small></div>
    </div>
    <div class="a-head">
      <div class="a-logo" contenteditable="true" data-k="aLogo">TWINKLE.STAR</div>
      <div class="a-title" contenteditable="true" data-k="aTitle">本周直播预告</div>
      <div class="a-date" contenteditable="true" data-k="aDate">9.28- 10.4</div>
    </div>
    <div class="a-days-row"><span></span><div class="a-days" contenteditable="true" data-k="aDays" spellcheck="false">
      <div><b>周一</b><i>Mon</i></div><div><b>周二</b><i>Tues</i></div><div><b>周三</b><i>Wed</i></div>
      <div><b>周四</b><i>Thur</i></div><div><b>周五</b><i>Fri</i></div><div><b>周六</b><i>Sat</i></div><div><b>周日</b><i>Sun</i></div>
    </div></div>
    <div id="aSecs"><!-- JS 生成主播行 --></div>
    <div class="a-corner" contenteditable="true" data-k="aCorner">每周更新</div>
  </div>
  </div>

  <!-- ================= 模板 B ================= -->
  <div class="canvas-wrap" id="wrapB" style="display:none">
  <div class="tpl" id="tplB">
    <div class="b-paper-tex"></div>
    <div class="b-corner tl" contenteditable="true" data-k="bC1">四</div>
    <div class="b-corner tr" contenteditable="true" data-k="bC2">禧</div>
    <div class="b-corner bl" contenteditable="true" data-k="bC3">丸</div>
    <div class="b-corner br" contenteditable="true" data-k="bC4">子</div>
    <div class="b-inner">
      <div class="b-topline">
        <div class="b-slogan" contenteditable="true" data-k="bSloganL">精选食材<span class="lines"></span></div>
        <div class="b-brand" contenteditable="true" data-k="bBrand" spellcheck="false"><span>禧</span><span>運</span><span>樓</span></div>
        <div class="b-slogan" contenteditable="true" data-k="bSloganR"><span class="lines"></span>手工制作</div>
      </div>
      <div class="b-title" contenteditable="true" data-k="bTitle">一周排班表</div>
      <div class="b-sub" contenteditable="true" data-k="bSub">2026.09.28-2026.10.04</div>
      <div class="b-stars" contenteditable="true" data-k="bStars">☆ ☆ ☆ ☆ ☆ ☆ ☆ ☆ ☆ ☆</div>
      <div class="b-members" id="bMembers"><!-- JS 生成成员圆标 --></div>
      <div class="b-grid" id="bGrid"><!-- JS 生成 --></div>
      <div class="b-foot">
        <div class="b-logo" contenteditable="true" data-k="bLogo">回禧丸子<small contenteditable="true" data-k="bLogoEn">SIXIWANZI</small></div>
      </div>
    </div>
    <div class="b-wave"></div>
  </div>
  </div>

</div>

<div id="exporting">⏳ 正在生成图片，请稍候…</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
/* ============ 数据（占位内容，可后期编辑，自动保存） ============ */
const DEFAULTS = {
  aRows: [
    {cls:'sec-yellow', name:'古堡龙眠', cells:{0:'21:00',1:'21:00',3:'18:00'}},
    {cls:'sec-blue',   name:'永恒娘',   cells:{0:'20:00'}},
    {cls:'sec-pink',   name:'dodo',     cells:{3:'video 18:00'}},
    {cls:'sec-green',  name:'露米',     cells:{}, note:'生病调养中'},
    {cls:'sec-purple', name:'露娜',     cells:{2:'22:30'}},
  ],
  bMembers: [
    {ch:'梨', color:'#e8899b'}, {ch:'沐', color:'#8fd0a0'},
    {ch:'恬', color:'#8fb8e0'}, {ch:'又', color:'#e8c94a'},
  ],
  bDays: ['周一|09.28','周二|09.29','周三|09.30','周四|10.01','周五|10.02','周六|10.03','周日|10.04'],
  bCells: {
    0:['沐又\n双播',''], 1:['18:30 又一','21:00 梨安'], 2:['休',''],
    3:['18:30 恬豆','21:00 又一'], 4:['18:30 梨安','21:00 沐霖'],
    5:['18:30 又一','21:00 恬豆'], 6:['18:30 沐霖','21:00 梨安'],
  },
};
let state = load() || structuredClone(DEFAULTS);
function load(){ try{ return JSON.parse(localStorage.getItem('tplState')); }catch(e){ return null; } }
function save(){ localStorage.setItem('tplState', JSON.stringify(state)); }

/* ============ 模板 A 渲染 ============ */
function renderA(){
  const box = document.getElementById('aSecs');
  box.innerHTML = '';
  state.aRows.forEach((r,ri)=>{
    const sec = document.createElement('div');
    sec.className = 'a-sec ' + r.cls;
    if(r.note){
      sec.innerHTML = `<div class="a-row" style="grid-template-columns:96px 1fr">
        <div class="a-who"><div class="a-avatar img-slot" data-img="aAva${ri}">🐳</div><div contenteditable="true" data-k="aName${ri}">${r.name}</div></div>
        <div class="a-note" contenteditable="true" data-k="aNote${ri}">${r.note}</div></div>`;
    }else{
      let cells = '';
      for(let d=0; d<7; d++){
        cells += `<div class="a-cell" contenteditable="true" data-k="aCell${ri}_${d}" spellcheck="false">${r.cells[d]||''}</div>`;
      }
      sec.innerHTML = `<div class="a-row">
        <div class="a-who"><div class="a-avatar img-slot" data-img="aAva${ri}">🐣</div><div contenteditable="true" data-k="aName${ri}">${r.name}</div></div>
        <div class="a-cells">${cells}</div></div>`;
    }
    box.appendChild(sec);
  });
  bindAll();
  restoreImgs();
}

/* ============ 模板 B 渲染 ============ */
function renderB(){
  const mBox = document.getElementById('bMembers');
  mBox.innerHTML = state.bMembers.map((m,i)=>
    `<div class="m img-slot" data-img="bMem${i}" style="background:${m.color}; width:52px;height:52px" contenteditable="true" data-k="bMem${i}">${m.ch}</div>`).join('');
  const grid = document.getElementById('bGrid');
  let html = state.bDays.map((d,i)=>{
    const [zh,dt] = d.split('|');
    return `<div class="b-dayhead"><b contenteditable="true" data-k="bDay${i}">${zh}</b><i contenteditable="true" data-k="bDate${i}">${dt}</i></div>`;
  }).join('');
  for(let row=0; row<2; row++){
    for(let c=0; c<7; c++){
      const v = (state.bCells[c]&&state.bCells[c][row])||'';
      const stamp = v==='休' ? ' stamp' : '';
      html += `<div class="b-cell${stamp}" contenteditable="true" data-k="bCell${c}_${row}" spellcheck="false">${stamp?'休':v.replace(/\n/g,'<br>')}</div>`;
    }
  }
  grid.innerHTML = html;
  bindAll();
}

/* ============ 通用：编辑绑定 / 自动保存 / 图片上传 ============ */
function bindAll(){
  document.querySelectorAll('[contenteditable]').forEach(el=>{
    const k = el.dataset.k; if(!k) return;
    // 恢复
    const saved = load();
    if(saved && saved.text && saved.text[k] != null) el.innerHTML = saved.text[k];
    el.addEventListener('input', ()=>{
      const s = load() || {};
      s.text = s.text || {};
      s.text[k] = el.innerHTML;
      if(k.startsWith('bCell')){ el.classList.toggle('stamp', el.textContent.trim()==='休'); }
      localStorage.setItem('tplState', JSON.stringify(s));
    });
    el.addEventListener('focus', ()=>{ window.lastCell = el; });
    el.addEventListener('click', ()=>{ window.lastCell = el; });
  });
  document.querySelectorAll('.img-slot').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.isContentEditable && el.contains(e.target) && e.target !== el && el.classList.contains('m')) return;
      window.currentSlot = el.dataset.img;
      document.getElementById('fileInput').click();
    };
  });
}
document.getElementById('fileInput').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f || !window.currentSlot) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const url = rd.result;
    const slot = document.querySelector(`[data-img="${window.currentSlot}"]`);
    slot.style.backgroundImage = `url(${url})`;
    slot.innerHTML = '';
    const s = load() || {}; s.imgs = s.imgs || {}; s.imgs[window.currentSlot] = url;
    localStorage.setItem('tplState', JSON.stringify(s));
  };
  rd.readAsDataURL(f);
  e.target.value = '';
});
function restoreImgs(){
  const s = load(); if(!s || !s.imgs) return;
  for(const [k,url] of Object.entries(s.imgs)){
    const slot = document.querySelector(`[data-img="${k}"]`);
    if(slot){ slot.style.backgroundImage = `url(${url})`; slot.innerHTML=''; }
  }
}

/* ============ 工具栏功能 ============ */
function switchTpl(t){
  document.getElementById('tplA').classList.toggle('active', t==='A');
  document.getElementById('tplB').classList.toggle('active', t==='B');
  document.getElementById('wrapA').style.display = t==='A'?'block':'none';
  document.getElementById('wrapB').style.display = t==='B'?'block':'none';
  document.getElementById('tabA').classList.toggle('active', t==='A');
  document.getElementById('tabB').classList.toggle('active', t==='B');
}
function addStamp(){
  const el = window.lastCell;
  if(!el){ alert('请先点击选中一个格子（时间格 / 排班格），再点本按钮'); return; }
  if(el.classList.contains('stamp')){
    el.classList.remove('stamp'); el.textContent = '';
  }else{
    el.classList.add('stamp'); el.textContent = '休';
  }
  el.dispatchEvent(new Event('input'));
}
function resetTpl(){
  if(!confirm('确定恢复全部占位内容？当前编辑将清空。')) return;
  localStorage.removeItem('tplState');
  location.reload();
}
async function exportPng(){
  const el = document.querySelector('.tpl.active');
  const box = document.getElementById('exporting');
  box.style.display = 'flex';
  try{
    if(typeof html2canvas === 'undefined') throw new Error('html2canvas 未加载（需联网访问 CDN）');
    const canvas = await html2canvas(el, {scale:2, useCORS:true, backgroundColor:null, logging:false});
    const a = document.createElement('a');
    a.download = (el.id==='tplA'?'直播预告_':'排班表_') + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }catch(err){ alert('导出失败：' + err.message); }
  box.style.display = 'none';
}

renderA();
renderB();
</script>
</body>
</html>
